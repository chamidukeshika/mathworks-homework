<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Portal — MathWorks</title>
  <link rel="icon" type="image/png" href="/logomaths.png">
  <link rel="stylesheet" href="/styles.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(','\\)'], ['$', '$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebarNav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a href="/teacher" class="brand">
        <div class="brand-mark"><span>M</span></div><span>MathWorks</span>
      </a>
    </div>
    <div class="top-actions">
      <span class="badge" id="whoBadge">Teacher</span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-nav" id="sidebarNav">
        <button class="nav-item active" data-view="dashboard" title="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="builder" title="Worksheet Builder">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          <span class="nav-label">Worksheet Builder</span>
        </button>
        <button class="nav-item" data-view="worksheets" title="My Worksheets">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span class="nav-label">My Worksheets</span>
        </button>
        <button class="nav-item" data-view="queue" title="Grading Queue">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span class="nav-label">Grading Queue</span>
        </button>
        <button class="nav-item" data-view="students" title="Students">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span class="nav-label">Students</span>
        </button>
        <div class="nav-spacer"></div>
      </div>
      <button class="sidebar-collapse-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </aside>

    <main class="main">
      <section id="dashboardView"></section>
      <section id="builderView" style="display:none"></section>
      <section id="worksheetsView" style="display:none"></section>
      <section id="queueView" style="display:none"></section>
      <section id="studentsView" style="display:none"></section>
      <section id="detailView" style="display:none"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="questionModal">
    <div class="modal">
      <div class="modal-head">
        <div><div class="eyebrow">Question editor</div><h2 id="modalTitle" style="margin:4px 0 0">Add question</h2></div>
        <button class="icon-btn" id="closeQuestionModal">×</button>
      </div>

      <div class="field">
        <label for="qText">Question</label>
        <textarea id="qText" placeholder="e.g. Solve for x: \(2x + 6 = 14\). Show your working."></textarea>
      </div>
      <div class="field">
        <label for="qMarks">Marks</label>
        <input class="input" id="qMarks" type="number" value="1" min="1" style="max-width:140px">
      </div>
      <div class="field">
        <label for="qGuidance">Grading guidance <span class="private-badge">🔒 Private — teacher only</span></label>
        <textarea id="qGuidance" placeholder="Expected working / model answer, for your reference while grading. Students never see this."></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button id="cancelQuestionBtn" class="btn btn-secondary">Cancel</button>
        <button id="saveQuestionBtn" class="btn btn-primary">Save question</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script defer src="/sidebar.js"></script>
  <script defer src="/teacher.js"></script>
</body>
</html>
